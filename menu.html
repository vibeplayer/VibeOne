<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Golf 3D - Menu</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Segoe UI', Roboto, sans-serif;
  background: #000;
  color: #fff;
  height: 100vh;
  touch-action: none;
}
#canvas-container {
  position: fixed;
  inset: 0;
  z-index: 0;
}
.vignette {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.0) 25%, rgba(0,0,0,0.4) 100%);
  pointer-events: none;
}
.screen {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transform: translateY(20px) scale(0.97);
  transition: opacity 0.42s cubic-bezier(.4,0,.2,1), transform 0.42s cubic-bezier(.34,1.56,.64,1);
}
.screen.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: all;
}
.logo {
  font-size: 72px; margin-bottom: 2px;
  filter: drop-shadow(0 0 28px rgba(76,175,80,0.75));
  animation: floatLogo 3.2s ease-in-out infinite;
  line-height: 1;
}
@keyframes floatLogo {
  0%,100%{ transform: translateY(0px); }
  50%{ transform: translateY(-9px); }
}
.game-title {
  font-size: 52px;
  font-weight: 900;
  background: linear-gradient(135deg, #c8e6c9 0%, #81c784 40%, #4caf50 70%, #66bb6a 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -2px; margin-bottom: 6px;
  filter: drop-shadow(0 0 14px rgba(76,175,80,0.45));
}
.game-subtitle {
  font-size: 12px;
  font-weight: 700;
  color: rgba(255,255,255,0.38);
  letter-spacing: 3.5px;
  text-transform: uppercase; margin-bottom: 44px;
}
.screen-title {
  font-size: 32px;
  font-weight: 900;
  background: linear-gradient(135deg, #c8e6c9 0%, #81c784 40%, #4caf50 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -1px; margin-bottom: 8px;
  filter: drop-shadow(0 0 10px rgba(76,175,80,0.35));
}
.screen-sub {
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.35);
  letter-spacing: 2.5px;
  text-transform: uppercase; margin-bottom: 36px;
}
@keyframes shimmerUI {
  0%{transform:skewX(13deg) translateX(-120%);}
  100%{transform:skewX(13deg) translateX(320%);}
}
@keyframes pulse {
  0%,100%{box-shadow:0 0 0 0 rgba(76,175,80,0.38),0 4px 0 #1a3d1c,0 6px 14px rgba(0,0,0,0.45)}
  50%{box-shadow:0 0 0 6px rgba(76,175,80,0),0 4px 0 #1a3d1c,0 6px 14px rgba(0,0,0,0.45)}
}
@keyframes btnIn {
  0%{opacity:0;transform:skewX(-13deg) translateY(36px) scale(0.88);}
  60%{transform:skewX(-13deg) translateY(-5px) scale(1.02);}
  100%{opacity:1;transform:skewX(-13deg) translateY(0) scale(1);}
}
@keyframes btnPress {
  0%{transform:skewX(-13deg) scale(1);}
  40%{transform:skewX(-13deg) scale(0.93) translateY(3px);}
  100%{transform:skewX(-13deg) scale(1);}
}
.btn-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.game-btn {
  position: relative;
  border: none;
  outline: none;
  border-radius: 5px;
  padding: 15px 0; width: 240px;
  font-size: 13px;
  font-weight: 900;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 2px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  color: #fff;
  transform: skewX(-13deg);
}
.game-btn.pressed { animation: btnPress 0.22s cubic-bezier(.34,1.56,.64,1) both; }
.game-btn .btn-border { position:absolute;inset:0;border-radius:5px;pointer-events:none;z-index:3; }
.game-btn .btn-shine {
  position:absolute;top:0;left:0;width:35%;height:100%;
  background:linear-gradient(100deg,rgba(255,255,255,0)0%,rgba(255,255,255,0.13)45%,rgba(255,255,255,0.20)50%,rgba(255,255,255,0.13)55%,rgba(255,255,255,0)100%);
  animation:shimmerUI 2.8s ease-in-out infinite;pointer-events:none;z-index:2;
}
.game-btn .btn-top {
  position:absolute;top:0;left:0;right:0;height:1px;z-index:4;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0.35)40%,rgba(255,255,255,0.50)60%,rgba(255,255,255,0));
}
.game-btn span { display:block;transform:skewX(13deg);position:relative;z-index:5; }
.btn-green {
  background: linear-gradient(165deg,#388e3c 0%,#2e7d32 45%,#1b5e20 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18),inset 0 -1px 0 rgba(0,0,0,0.30),0 4px 0 #1a3d1c,0 6px 14px rgba(0,0,0,0.45);
}
.btn-green .btn-border { box-shadow:inset 0 0 0 1px rgba(76,175,80,0.65),inset 0 0 0 2px rgba(76,175,80,0.15); }
.btn-purple {
  background: linear-gradient(165deg,#7b1fa2 0%,#6a1b9a 45%,#4a148c 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18),inset 0 -1px 0 rgba(0,0,0,0.30),0 4px 0 #2d0a5e,0 6px 14px rgba(0,0,0,0.45);
}
.btn-purple .btn-border { box-shadow:inset 0 0 0 1px rgba(186,104,200,0.65),inset 0 0 0 2px rgba(186,104,200,0.15); }
.btn-blue {
  background: linear-gradient(165deg,#1976d2 0%,#1565c0 45%,#0d47a1 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18),inset 0 -1px 0 rgba(0,0,0,0.30),0 4px 0 #0a2f6e,0 6px 14px rgba(0,0,0,0.45);
}
.btn-blue .btn-border { box-shadow:inset 0 0 0 1px rgba(33,150,243,0.65),inset 0 0 0 2px rgba(33,150,243,0.15); }
.btn-back {
  background: none;
  border: none;
  outline: none;
  color: rgba(255,255,255,0.45);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  padding: 10px 20px; margin-top: 2px;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.2s;
}
.btn-back:hover { color: rgba(255,255,255,0.85); }
.visible .game-btn:nth-child(1) {
  animation: btnIn 0.52s cubic-bezier(.34,1.4,.64,1) 0.08s both, pulse 2.8s ease-in-out 0.7s infinite;
}
.visible .btn-back {
  animation: btnIn 0.52s cubic-bezier(.34,1.4,.64,1) 0.18s both;
}
#levels-screen {
  background: rgba(0,0,0,0);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.levels-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 13px; margin-bottom: 24px;
}
.level-card {
  position: relative;
  background: linear-gradient(165deg,#388e3c 0%,#2e7d32 45%,#1b5e20 100%);
  border-radius: 5px;
  padding: 20px 16px 18px;
  text-align: center;
  cursor: pointer;
  transform: skewX(-13deg);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18),inset 0 -1px 0 rgba(0,0,0,0.30),0 4px 0 #1a3d1c,0 6px 14px rgba(0,0,0,0.40);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent; min-width: 82px;
}
.level-card::before {
  content:'';position:absolute;inset:0;border-radius:5px;
  box-shadow:inset 0 0 0 1px rgba(76,175,80,0.65),inset 0 0 0 2px rgba(76,175,80,0.15);
  pointer-events:none;z-index:3;
}
.level-card::after {
  content:'';position:absolute;top:0;left:0;width:35%;height:100%;
  background:linear-gradient(100deg,rgba(255,255,255,0)0%,rgba(255,255,255,0.13)45%,rgba(255,255,255,0.20)50%,rgba(255,255,255,0.13)55%,rgba(255,255,255,0)100%);
  animation:shimmerUI 3.2s ease-in-out infinite;pointer-events:none;z-index:2;
}
.level-card.pressed { animation: btnPress 0.20s cubic-bezier(.34,1.56,.64,1) both; }
.level-card .lbl {
  font-size:9px;font-weight:800;text-transform:uppercase;
  letter-spacing:1.5px;color:#81c784;opacity:0.85;
  transform:skewX(13deg);display:block;position:relative;z-index:4;
}
.level-card .num {
  font-size:30px;font-weight:900;color:#fff;line-height:1.1;
  transform:skewX(13deg);display:block;position:relative;z-index:4;
  text-shadow:0 0 10px rgba(129,199,132,0.5),0 1px 3px rgba(0,0,0,0.5);
}
.visible .level-card:nth-child(1){animation:cardIn 0.45s cubic-bezier(.34,1.4,.64,1) 0.05s both;}
.visible .level-card:nth-child(2){animation:cardIn 0.45s cubic-bezier(.34,1.4,.64,1) 0.10s both;}
.visible .level-card:nth-child(3){animation:cardIn 0.45s cubic-bezier(.34,1.4,.64,1) 0.15s both;}
.visible .level-card:nth-child(4){animation:cardIn 0.45s cubic-bezier(.34,1.4,.64,1) 0.20s both;}
.visible .level-card:nth-child(5){animation:cardIn 0.45s cubic-bezier(.34,1.4,.64,1) 0.25s both;}
.visible .level-card:nth-child(6){animation:cardIn 0.45s cubic-bezier(.34,1.4,.64,1) 0.30s both;}
.visible .level-card:nth-child(7){animation:cardIn 0.45s cubic-bezier(.34,1.4,.64,1) 0.35s both;}
.visible .level-card:nth-child(8){animation:cardIn 0.45s cubic-bezier(.34,1.4,.64,1) 0.40s both;}
.visible .level-card:nth-child(9){animation:cardIn 0.45s cubic-bezier(.34,1.4,.64,1) 0.45s both;}
@keyframes cardIn {
  0%{opacity:0;transform:skewX(-13deg) translateY(28px) scale(0.90);}
  60%{transform:skewX(-13deg) translateY(-4px) scale(1.02);}
  100%{opacity:1;transform:skewX(-13deg) translateY(0) scale(1);}
}

/* CUSTOM LEVEL SCREEN */
#custom-screen {
  background: rgba(0,0,0,0);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 24px;
}
.custom-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 480px;
}
.custom-textarea-wrap {
  width: 100%;
  position: relative;
  margin-bottom: 18px;
}
#custom-code-input {
  width: 100%;
  height: 220px;
  background: rgba(10,20,10,0.85);
  border: 1.5px solid rgba(76,175,80,0.35);
  border-radius: 8px;
  color: #b9f6ca;
  font-family: 'SF Mono', 'Fira Mono', 'Menlo', monospace;
  font-size: 11px;
  line-height: 1.6;
  padding: 14px;
  resize: none;
  outline: none;
  box-shadow: inset 0 2px 12px rgba(0,0,0,0.5), 0 0 0 1px rgba(76,175,80,0.10);
  transition: border-color 0.2s;
  letter-spacing: 0.2px;
}
#custom-code-input:focus {
  border-color: rgba(76,175,80,0.75);
  box-shadow: inset 0 2px 12px rgba(0,0,0,0.5), 0 0 0 2px rgba(76,175,80,0.18);
}
#custom-code-input::placeholder {
  color: rgba(129,199,132,0.28);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', sans-serif;
  font-size: 12px;
}
.custom-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(129,199,132,0.55);
  margin-bottom: 10px;
  align-self: flex-start;
}
.custom-btn-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 100%;
}
.custom-status {
  font-size: 11px;
  font-weight: 700;
  color: rgba(129,199,132,0.7);
  letter-spacing: 1px;
  min-height: 18px;
  text-align: center;
}

.bottom-info {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 11;
  font-size: 10px;
  font-weight: 700;
  color: rgba(255,255,255,0.20);
  letter-spacing: 2px;
  text-transform: uppercase;
  pointer-events: none; white-space: nowrap;
}
</style>
</head>

<script type="module">
import * as THREE from 'three';
const FW=32,FWL=80,COAST_W=14;
const WATER_Y=-2.2;
const TERRAIN_MIN_H=WATER_Y+1.4;
const GRASS_COLOR='#0C270E';

function terrainFn(x,z){
  const tz=z/FWL,tx=x/FW;
  return Math.max(Math.sin(tz*Math.PI*0.7)*0.45+Math.cos(tz*Math.PI*0.3)*0.18+Math.sin(tx*Math.PI*0.4)*0.10,TERRAIN_MIN_H);
}
function getWorldHeight(x,z){
  const inFW=Math.abs(x)<FW/2&&z>-FWL/2&&z<FWL/2;
  if(inFW)return Math.max(terrainFn(x,z),TERRAIN_MIN_H);
  const distX=Math.max(0,Math.abs(x)-FW/2),distZ=Math.max(0,Math.max(z-FWL/2,-z-FWL/2));
  const de=Math.max(distX,distZ),tN=Math.min(de/COAST_W,1),e=tN*tN*(3-2*tN);
  const cx=Math.max(-FW/2+0.05,Math.min(FW/2-0.05,x));
  const cz=Math.max(-FWL/2+0.05,Math.min(FWL/2-0.05,z));
  const edgeH=Math.max(terrainFn(cx,cz),TERRAIN_MIN_H);
  return edgeH*(1-e)+WATER_Y*e-Math.max(0,(tN-0.72)/0.28)*2.0;
}

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.getElementById('canvas-container').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.FogExp2(0x87ceeb,0.009);
const camera=new THREE.PerspectiveCamera(55,window.innerWidth/window.innerHeight,0.1,400);
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

const sun=new THREE.DirectionalLight(0xfffbe8,2.2);
sun.position.set(18,45,20);sun.castShadow=true;
sun.shadow.mapSize.set(512,512);
sun.shadow.camera.left=-60;sun.shadow.camera.right=60;
sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;
sun.shadow.camera.near=5;sun.shadow.camera.far=130;
sun.shadow.bias=-0.001;scene.add(sun);
scene.add(new THREE.AmbientLight(0xb0cce8,0.75));
scene.add(new THREE.HemisphereLight(0x87ceeb,0x2d6a10,0.60));

const maxAniso=Math.min(renderer.capabilities.getMaxAnisotropy(),4);
function makeTex(w,h,fn,rx,ry){
  const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);
  t.anisotropy=maxAniso;t.generateMipmaps=true;t.minFilter=THREE.LinearMipmapLinearFilter;return t;
}
const fairwayTex=makeTex(256,256,(ctx,w,h)=>{
  ctx.fillStyle=GRASS_COLOR;ctx.fillRect(0,0,w,h);
  for(let r=0;r<16;r++){ctx.fillStyle=r%2===0?'rgba(0,40,0,0.10)':'rgba(80,160,40,0.06)';ctx.fillRect(0,r*(h/16),w,h/16);}
  for(let i=0;i<1200;i++){
    const x=Math.random()*w,y=Math.random()*h;
    ctx.strokeStyle=`hsla(${95+Math.random()*30},50%,${20+Math.random()*20}%,${0.2+Math.random()*0.4})`;
    ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(Math.random()-0.5)*2,y-2-Math.random()*4);ctx.stroke();
  }
},8,20);
const sandTex=makeTex(128,128,(ctx,w,h)=>{
  ctx.fillStyle='#c2a96e';ctx.fillRect(0,0,w,h);
  for(let i=0;i<1500;i++){
    const x=Math.random()*w,y=Math.random()*h,v=Math.floor(155+Math.random()*60);
    ctx.fillStyle=`rgba(${v},${Math.floor(v*0.85)},${Math.floor(v*0.55)},0.5)`;ctx.fillRect(x,y,1,1);
  }
});
const waterTex=makeTex(128,128,(ctx,w,h)=>{
  ctx.fillStyle='#1565c0';ctx.fillRect(0,0,w,h);
  for(let i=0;i<10;i++){
    const y=i*(h/10)+Math.random()*4;
    ctx.strokeStyle=`rgba(255,255,255,${0.04+Math.random()*0.07})`;
    ctx.lineWidth=1+Math.random()*1.5;ctx.beginPath();ctx.moveTo(0,y);
    for(let x=0;x<w;x+=5)ctx.lineTo(x+5,y+Math.sin(x*0.12+i)*2);ctx.stroke();
  }
},3,4);
const bumpTex=makeTex(128,128,(ctx,w,h)=>{
  ctx.fillStyle='#808080';ctx.fillRect(0,0,w,h);
  for(let i=0;i<800;i++){
    const x=Math.random()*w,y=Math.random()*h,v=Math.floor(90+Math.random()*90);
    ctx.fillStyle=`rgb(${v},${v},${v})`;ctx.beginPath();ctx.arc(x,y,1+Math.random()*2,0,Math.PI*2);ctx.fill();
  }
});
const ballTex=makeTex(256,256,(ctx,w,h)=>{
  const g=ctx.createRadialGradient(w*0.35,h*0.3,2,w/2,h/2,w*0.5);
  g.addColorStop(0,'#ffffff');g.addColorStop(0.45,'#f8f8f8');g.addColorStop(0.85,'#e8e8e8');g.addColorStop(1,'#d0d0d0');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  for(let row=0;row<12;row++)for(let col=0;col<12;col++){
    const ox=row%2===0?0:12,x=col*22+ox+4,y=row*22+4,r=4;
    const dg=ctx.createRadialGradient(x+r*0.3,y+r*0.3,0,x,y,r);
    dg.addColorStop(0,'rgba(100,100,100,0.25)');dg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=dg;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  const ref=ctx.createRadialGradient(w*0.3,h*0.25,0,w*0.35,h*0.3,w*0.18);
  ref.addColorStop(0,'rgba(255,255,255,0.5)');ref.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=ref;ctx.fillRect(0,0,w,h);
},1,1);

const skyCV=document.createElement('canvas');skyCV.width=512;skyCV.height=256;
const skyCtx=skyCV.getContext('2d');
const skyG=skyCtx.createLinearGradient(0,0,0,256);
skyG.addColorStop(0,'#1565c0');skyG.addColorStop(0.45,'#42a5f5');skyG.addColorStop(1,'#b3e0f7');
skyCtx.fillStyle=skyG;skyCtx.fillRect(0,0,512,256);
scene.add(new THREE.Mesh(new THREE.SphereGeometry(200,24,12),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(skyCV),side:THREE.BackSide})));

const sC=document.createElement('canvas');sC.width=128;sC.height=128;
const sc2=sC.getContext('2d');
const sh=sc2.createRadialGradient(64,64,10,64,64,64);
sh.addColorStop(0,'rgba(255,255,200,1)');sh.addColorStop(0.25,'rgba(255,240,80,0.7)');sh.addColorStop(1,'rgba(0,0,0,0)');
sc2.fillStyle=sh;sc2.fillRect(0,0,128,128);
const d2=sc2.createRadialGradient(58,56,0,64,64,22);
d2.addColorStop(0,'rgba(255,255,240,1)');d2.addColorStop(1,'rgba(255,210,60,0.9)');
sc2.fillStyle=d2;sc2.beginPath();sc2.arc(64,64,22,0,Math.PI*2);sc2.fill();
const sunSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(sC),transparent:true,depthWrite:false,depthTest:false}));
sunSprite.scale.setScalar(18);sunSprite.position.set(50,45,-150);sunSprite.renderOrder=1;scene.add(sunSprite);

const cloudGroups=[];
for(let ci=0;ci<6;ci++){
  const cg=new THREE.Group();
  const blobs=3+Math.floor(Math.random()*3);
  for(let bi=0;bi<blobs;bi++){
    const bC=document.createElement('canvas');bC.width=64;bC.height=64;
    const bc=bC.getContext('2d');
    const bg=bc.createRadialGradient(32,36,0,32,32,30);
    bg.addColorStop(0,'rgba(255,255,255,1)');bg.addColorStop(0.6,'rgba(240,245,255,0.8)');bg.addColorStop(1,'rgba(200,220,255,0)');
    bc.fillStyle=bg;bc.fillRect(0,0,64,64);
    const bM=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(bC),transparent:true,depthWrite:false,depthTest:false}));
    const bS=4+Math.random()*5;bM.scale.set(bS*1.3,bS,1);
    bM.position.set((bi-(blobs/2))*2.8+Math.random()*1.5-0.75,Math.random()*1.5-0.5,0);
    cg.add(bM);
  }
  const ang=Math.random()*Math.PI*2,dist=60+Math.random()*40;
  cg.position.set(Math.cos(ang)*dist,20+Math.random()*18,Math.sin(ang)*dist-40);
  cg.userData={sx:(Math.random()-0.5)*0.5+0.2};
  cg.renderOrder=2;scene.add(cg);cloudGroups.push(cg);
}

const fairwayGeo=new THREE.PlaneGeometry(FW,FWL,48,280);
const fp=fairwayGeo.attributes.position.array;
for(let i=0;i<fp.length;i+=3){fp[i+2]=terrainFn(fp[i],fp[i+1]);}
fairwayGeo.computeVertexNormals();
const fairwayMesh=new THREE.Mesh(fairwayGeo,new THREE.MeshStandardMaterial({
  map:fairwayTex,bumpMap:bumpTex,bumpScale:0.008,roughness:0.92,metalness:0,
  polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2
}));
fairwayMesh.rotation.x=-Math.PI/2;fairwayMesh.receiveShadow=true;scene.add(fairwayMesh);

const CTOTAL_W=FW+COAST_W*2,CTOTAL_L=FWL+COAST_W*2;
const coastGeo=new THREE.PlaneGeometry(CTOTAL_W,CTOTAL_L,32,120);
const caVCount=coastGeo.attributes.position.count;
const caCol=new Float32Array(caVCount*3);
const gR=0x2e/255,gG=0x7d/255,gB=0x32/255;
const sR=0.76,sG2=0.66,sB=0.43;
for(let vi=0;vi<caVCount;vi++){
  const wx=coastGeo.attributes.position.getX(vi),wz=coastGeo.attributes.position.getY(vi);
  const inFW=Math.abs(wx)<FW/2&&wz>-FWL/2&&wz<FWL/2;
  coastGeo.attributes.position.setZ(vi,inFW?Math.max(terrainFn(wx,wz),TERRAIN_MIN_H)-0.08:getWorldHeight(wx,wz));
  const distX=Math.max(0,Math.abs(wx)-FW/2),distZ=Math.max(0,Math.max(wz-FWL/2,-wz-FWL/2));
  const de=Math.max(distX,distZ),tN=Math.min(de/COAST_W,1),blend=Math.min(tN/0.35,1.0),e=blend*blend*(3-2*blend);
  caCol[vi*3+0]=THREE.MathUtils.lerp(gR,sR,e);
  caCol[vi*3+1]=THREE.MathUtils.lerp(gG,sG2,e);
  caCol[vi*3+2]=THREE.MathUtils.lerp(gB,sB,e);
}
coastGeo.setAttribute('color',new THREE.BufferAttribute(caCol,3));coastGeo.computeVertexNormals();
const coastMesh=new THREE.Mesh(coastGeo,new THREE.MeshStandardMaterial({map:sandTex,vertexColors:true,roughness:0.95,metalness:0}));
coastMesh.rotation.x=-Math.PI/2;coastMesh.receiveShadow=true;scene.add(coastMesh);

const basePlane=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshStandardMaterial({color:0x0a2a5a,roughness:1.0}));
basePlane.rotation.x=-Math.PI/2;basePlane.position.y=WATER_Y-0.1;scene.add(basePlane);
const waterMesh=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({
  map:waterTex,transparent:true,opacity:0.88,roughness:0.05,metalness:0.12,color:0x1565c0
}));
waterMesh.rotation.x=-Math.PI/2;waterMesh.position.y=WATER_Y;scene.add(waterMesh);

const BALL_R=0.20;
const ballMesh=new THREE.Mesh(
  new THREE.SphereGeometry(BALL_R,24,24),
  new THREE.MeshStandardMaterial({map:ballTex,roughness:0.20,metalness:0.08})
);
const ballStartZ=32;
const ballH=Math.max(terrainFn(0,ballStartZ),TERRAIN_MIN_H)+BALL_R+0.05;
ballMesh.position.set(0,ballH,ballStartZ);
ballMesh.castShadow=true;scene.add(ballMesh);

const shC=document.createElement('canvas');shC.width=32;shC.height=32;
const shCtx=shC.getContext('2d');
const shG=shCtx.createRadialGradient(16,16,0,16,16,16);
shG.addColorStop(0,'rgba(0,0,0,0.60)');shG.addColorStop(0.4,'rgba(0,0,0,0.25)');shG.addColorStop(1,'rgba(0,0,0,0)');
shCtx.fillStyle=shG;shCtx.fillRect(0,0,32,32);
const blobShadow=new THREE.Mesh(
  new THREE.PlaneGeometry(0.7,0.7),
  new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(shC),transparent:true,opacity:0.55,depthWrite:false})
);
blobShadow.rotation.x=-Math.PI/2;
blobShadow.position.set(0,Math.max(terrainFn(0,ballStartZ),TERRAIN_MIN_H)+0.01,ballStartZ);
scene.add(blobShadow);

const HOLE_X=0,HOLE_Z=-30;
const holeH=Math.max(terrainFn(HOLE_X,HOLE_Z),TERRAIN_MIN_H);
const holeGroup=new THREE.Group();holeGroup.position.set(HOLE_X,holeH,HOLE_Z);scene.add(holeGroup);
const holeWalls=new THREE.Mesh(
  new THREE.CylinderGeometry(0.39,0.39,0.70,24,1,true),
  new THREE.MeshStandardMaterial({color:0x111111,roughness:1.0,side:THREE.BackSide})
);
holeWalls.position.y=-0.35;holeGroup.add(holeWalls);
const holeCap=new THREE.Mesh(new THREE.CircleGeometry(0.415,24),new THREE.MeshBasicMaterial({color:0x060606,depthWrite:true}));
holeCap.rotation.x=-Math.PI/2;holeCap.position.y=0.005;holeGroup.add(holeCap);
const holeRing=new THREE.Mesh(
  new THREE.TorusGeometry(0.400,0.044,12,48),
  new THREE.MeshStandardMaterial({color:0xdddddd,metalness:0.96,roughness:0.06})
);
holeRing.rotation.x=-Math.PI/2;holeRing.position.y=0.042;holeGroup.add(holeRing);

const POLE_H=2.4,FLAG_W=0.85,FLAG_H=0.52,FLAG_WS=10,FLAG_HS=6;
const flagGroup=new THREE.Group();flagGroup.position.set(HOLE_X,holeH,HOLE_Z);scene.add(flagGroup);
const poleMesh=new THREE.Mesh(
  new THREE.CylinderGeometry(0.024,0.024,POLE_H,8),
  new THREE.MeshStandardMaterial({color:0xcccccc,metalness:0.90,roughness:0.10})
);
poleMesh.position.y=POLE_H/2;flagGroup.add(poleMesh);
const flagGeo=new THREE.PlaneGeometry(FLAG_W,FLAG_H,FLAG_WS,FLAG_HS);
const fpa2=flagGeo.attributes.position.array;
for(let i=0;i<fpa2.length;i+=3){fpa2[i]+=FLAG_W/2;fpa2[i+1]-=FLAG_H/2;}
flagGeo.computeVertexNormals();
const flagRestPos=[];
for(let i=0;i<flagGeo.attributes.position.count;i++){
  flagRestPos.push({
    x:flagGeo.attributes.position.getX(i),
    y:flagGeo.attributes.position.getY(i),
    z:flagGeo.attributes.position.getZ(i)
  });
}
const flagMesh2=new THREE.Mesh(flagGeo,new THREE.MeshStandardMaterial({color:0xff1744,side:THREE.DoubleSide,roughness:0.75}));
flagMesh2.position.y=POLE_H;flagGroup.add(flagMesh2);

const CAM_MAIN ={pos:new THREE.Vector3(26,20,50), look:new THREE.Vector3(0,1,0)};
const CAM_OPTIONS={pos:new THREE.Vector3(10,7,36), look:new THREE.Vector3(0,1,8)};
const camCurrent={pos:CAM_MAIN.pos.clone(),look:CAM_MAIN.look.clone()};
const camTarget ={pos:CAM_MAIN.pos.clone(),look:CAM_MAIN.look.clone()};
camera.position.copy(CAM_MAIN.pos);camera.lookAt(CAM_MAIN.look);

function setCamTarget(state){
  if(state==='main'){camTarget.pos.copy(CAM_MAIN.pos);camTarget.look.copy(CAM_MAIN.look);}
  else{camTarget.pos.copy(CAM_OPTIONS.pos);camTarget.look.copy(CAM_OPTIONS.look);}
}

let flagTick=0;
function animateFlag(t){
  flagTick++;if(flagTick%2!==0)return;
  const pa=flagGeo.attributes.position,tc=FLAG_WS+1,tr=FLAG_HS+1;
  for(let row=0;row<tr;row++)for(let col=0;col<tc;col++){
    const i=row*tc+col,r=flagRestPos[i],u=r.x/FLAG_W;
    const amp=u*u*0.16,ph=u*Math.PI*2.8-t*4.0,phY=(r.y/FLAG_H)*0.8;
    pa.setX(i,r.x);
    pa.setY(i,r.y+Math.sin(ph*0.7+t*1.8)*u*0.025);
    pa.setZ(i,r.z+Math.sin(ph+phY)*amp+Math.sin(ph*1.6-t*2.5+phY)*amp*0.35);
  }
  pa.needsUpdate=true;
  if(flagTick%6===0)flagGeo.computeVertexNormals();
}

let waterTime=0;
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  camCurrent.pos.lerp(camTarget.pos,0.042);
  camCurrent.look.lerp(camTarget.look,0.042);
  camera.position.copy(camCurrent.pos);
  camera.lookAt(camCurrent.look);
  waterTime+=dt;
  waterMesh.material.map.offset.set(Math.sin(waterTime*0.22)*0.04,waterTime*0.035);
  waterMesh.material.map.needsUpdate=true;
  cloudGroups.forEach(cg=>{
    cg.position.x+=cg.userData.sx*0.014;
    if(cg.position.x>140)cg.position.x=-140;
  });
  ballMesh.position.y=ballH+Math.sin(t*1.2)*0.06;
  ballMesh.rotation.y+=dt*0.35;
  animateFlag(t);
  renderer.render(scene,camera);
}
animate();

// NAVIGAZIONE UI
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('visible');
    s.style.pointerEvents='none';
  });
  const el=document.getElementById(id);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.classList.add('visible');
    el.style.pointerEvents='all';
  }));
}

document.querySelectorAll('.game-btn').forEach(btn=>{
  btn.addEventListener('pointerdown',()=>{
    btn.classList.remove('pressed');void btn.offsetWidth;btn.classList.add('pressed');
  });
  btn.addEventListener('pointerup',()=>setTimeout(()=>btn.classList.remove('pressed'),280));
  btn.addEventListener('animationend',e=>{if(e.animationName==='btnPress')btn.classList.remove('pressed');});
});

document.getElementById('btn-gioca').addEventListener('click',()=>{
  showScreen('options-menu');
  setCamTarget('options');
});
document.getElementById('btn-back-main').addEventListener('click',()=>{
  showScreen('main-menu');
  setCamTarget('main');
});
document.getElementById('btn-livelli').addEventListener('click',()=>{
  showScreen('levels-screen');
});
document.getElementById('btn-back-levels').addEventListener('click',()=>{
  showScreen('options-menu');
});

// CUSTOM LEVEL
document.getElementById('btn-custom').addEventListener('click',()=>{
  // Carica eventuale codice salvato
  const saved = localStorage.getItem('customLevelCode');
  if(saved){
    document.getElementById('custom-code-input').value = saved;
  }
  document.getElementById('custom-status').textContent = '';
  showScreen('custom-screen');
});

document.getElementById('btn-back-custom').addEventListener('click',()=>{
  showScreen('options-menu');
});

document.getElementById('btn-play-custom').addEventListener('click',()=>{
  const code = document.getElementById('custom-code-input').value.trim();
  const statusEl = document.getElementById('custom-status');
  if(!code){
    statusEl.style.color='rgba(255,100,100,0.85)';
    statusEl.textContent='⚠ Inserisci il codice del livello prima di giocare.';
    return;
  }
  // Valida il codice: prova a creare la funzione
  try {
    const testFn = new Function('return ' + code)();
    if(typeof testFn !== 'function'){
      throw new Error('Non è una funzione');
    }
    // Test con valori di prova
    const testResult = testFn(0, 0, 80, 32);
    if(typeof testResult !== 'number'){
      throw new Error('La funzione deve restituire un numero');
    }
  } catch(err) {
    statusEl.style.color='rgba(255,100,100,0.85)';
    statusEl.textContent='⚠ Codice non valido: ' + err.message;
    return;
  }
  // Salva in localStorage
  localStorage.setItem('customLevelCode', code);
  statusEl.style.color='rgba(129,199,132,0.9)';
  statusEl.textContent='✓ Livello salvato! Avvio...';
  setTimeout(()=>{
    window.location.href='game.html?level=custom';
  }, 600);
});

document.getElementById('btn-open-editor').addEventListener('click',()=>{
  window.location.href='editor.html';
});
