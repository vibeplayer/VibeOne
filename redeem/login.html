<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vibe Login</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #fdfdfd;
            --surface: #ffffff;
            --primary: #1f1f1f;
            --text: #1f1f1f;
            --sub: #70757a;
            --border: #e0e0e0;
            --error: #ba1a1a;
            --accent-soft: #f1f3f4;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --surface: #1e1f20;
                --primary: #e3e3e3;
                --text: #e3e3e3;
                --sub: #9aa0a6;
                --border: #444746;
                --accent-soft: #2d2e30;
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: 'Google Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Container con transizione di scorrimento laterale tra le viste */
        .auth-viewport {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px 24px;
            position: relative;
        }

        /* Animazioni di transizione */
        .step-section {
            width: 100%;
            position: absolute;
            top: 40px;
            left: 0;
            padding: 0 24px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateX(30px);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            height: calc(100% - 80px);
        }

        .step-section.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .step-section.exit {
            opacity: 0;
            transform: translateX(-30px);
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 32px;
            text-align: center;
        }

        h2 { font-size: 24px; font-weight: 500; margin: 0 0 12px 0; }
        p { font-size: 16px; color: var(--sub); margin-bottom: 32px; }

        /* Input Moderno */
        .field-box { position: relative; margin-bottom: 8px; }
        .field {
            width: 100%;
            padding: 20px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        .field:focus { border: 2px solid var(--primary); padding: 19px 15px; }

        /* PIN mobile style */
        .pin-container { display: flex; justify-content: center; gap: 16px; margin: 20px 0; }
        .pin-dot {
            width: 50px; height: 65px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            text-align: center; font-size: 24px;
            color: var(--text); outline: none;
        }
        .pin-dot:focus { border: 2px solid var(--primary); }

        /* Actions */
        .footer-actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
        }

        .btn-full {
            background: var(--primary);
            color: var(--bg);
            padding: 18px;
            border-radius: 16px;
            border: none;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-full:active { transform: scale(0.98); }

        .btn-text {
            background: transparent;
            color: var(--text);
            padding: 12px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Account Card */
        .acc-row {
            display: flex; align-items: center;
            padding: 16px; background: var(--accent-soft);
            border-radius: 16px; margin-bottom: 12px;
            cursor: pointer;
        }
        .acc-img { width: 44px; height: 44px; border-radius: 50%; margin-right: 16px; object-fit: cover; }
        .acc-name { font-weight: 500; flex: 1; }

        /* Setup Avatar */
        .avatar-upload {
            width: 140px; height: 140px; border-radius: 70px;
            margin: 20px auto; position: relative;
            background: var(--accent-soft);
            overflow: hidden; cursor: pointer;
        }
        .avatar-upload img { width: 100%; height: 100%; object-fit: cover; }

        .error { color: var(--error); font-size: 13px; margin-top: 8px; text-align: left; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="auth-viewport">
    <div class="brand"></div>

    <div id="view-accounts" class="step-section">
        <h2>Bentornato</h2>
        <p>Scegli un account salvato</p>
        <div id="account-list"></div>
        <div class="footer-actions">
            <button class="btn-text" onclick="showStep('user')">Usa un altro account</button>
        </div>
    </div>

    <div id="view-user" class="step-section">
        <h2 id="user-title">Accedi</h2>
        <p id="user-desc">Inserisci il tuo username. Se non esiste, verrà creato un nuovo account.</p>
        <div class="field-box">
            <input type="text" id="inp-username" class="field" placeholder="Username" autocomplete="off">
            <div id="err-user" class="error"></div>
        </div>
        <div class="footer-actions">
            <button class="btn-full" onclick="handleUserNext()">Continua</button>
            <button id="btn-back-accounts" class="btn-text hidden" onclick="showStep('accounts')">Torna agli account</button>
        </div>
    </div>

    <div id="view-pin" class="step-section">
        <h2 id="pin-title">Sicurezza</h2>
        <p id="pin-desc">Inserisci il PIN per il tuo account</p>
        <div class="pin-container">
            <input type="password" class="pin-dot" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-dot" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-dot" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-dot" maxlength="1" inputmode="numeric">
        </div>
        <div id="err-pin" class="error"></div>
        <div class="footer-actions">
            <button class="btn-full" onclick="handlePinNext()">Conferma</button>
            <button class="btn-text" onclick="showStep('user')">Indietro</button>
        </div>
    </div>

    <div id="view-setup" class="step-section">
        <h2>Profilo</h2>
        <p>Aggiungi una foto al tuo nuovo account</p>
        <div class="avatar-upload" onclick="document.getElementById('file-input').click()">
            <img src="" id="setup-preview">
        </div>
        <input type="file" id="file-input" hidden accept="image/*" onchange="previewFile(this)">
        <div class="footer-actions">
            <button class="btn-full" onclick="finishAll()">Crea Account</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://mgofkzcnppsydkknbuhw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_tC8Z0ewOX4U1Xh0lST9gKQ_yWLcN67j'; 
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let state = { username: '', isLogin: false, dbPin: null, tempPin: '', avatarUrl: '' };
    const pinInputs = document.querySelectorAll('.pin-dot');

    // --- NAVIGAZIONE FLUIDA ---
    function showStep(stepId) {
        document.querySelectorAll('.step-section').forEach(s => {
            s.classList.remove('active');
            s.classList.add('exit');
        });
        const next = document.getElementById('view-' + stepId);
        setTimeout(() => {
            document.querySelectorAll('.step-section').forEach(s => s.classList.remove('exit'));
            next.classList.add('active');
        }, 50);
        if(stepId === 'pin') resetPin();
    }

    // --- LOGICA USERNAME ---
    async function handleUserNext() {
        const user = document.getElementById('inp-username').value.trim();
        if(user.length < 3) return (document.getElementById('err-user').innerText = "Troppo corto");

        const { data } = await sb.from('users').select('*').eq('username', user).maybeSingle();
        state.username = user;
        
        if(data) {
            state.isLogin = true;
            state.dbPin = data.pin;
            state.avatarUrl = data.avatar_url;
            document.getElementById('pin-title').innerText = "Bentornato";
            document.getElementById('pin-desc').innerText = "Inserisci il tuo PIN di accesso";
        } else {
            state.isLogin = false;
            state.avatarUrl = `https://ui-avatars.com/api/?name=${user}&background=random`;
            document.getElementById('pin-title').innerText = "Crea PIN";
            document.getElementById('pin-desc').innerText = "Scegli un codice a 4 cifre per il nuovo account";
        }
        showStep('pin');
    }

    // --- LOGICA PIN ---
    function handlePinNext() {
        let pin = ""; pinInputs.forEach(i => pin += i.value);
        if(pin.length < 4) return (document.getElementById('err-pin').innerText = "Inserisci 4 cifre");

        if(state.isLogin) {
            if(pin === state.dbPin) finalizeSession();
            else { document.getElementById('err-pin').innerText = "PIN Errato"; resetPin(); }
        } else {
            state.tempPin = pin;
            document.getElementById('setup-preview').src = state.avatarUrl;
            showStep('setup');
        }
    }

    // --- SETUP AVATAR & FINE ---
    async function previewFile(input) {
        if (!input.files[0]) return;
        const file = input.files[0];
        const fileName = `avatars/${Date.now()}_${state.username}`;
        await sb.storage.from('avatars').upload(fileName, file);
        const { data } = sb.storage.from('avatars').getPublicUrl(fileName);
        state.avatarUrl = data.publicUrl;
        document.getElementById('setup-preview').src = state.avatarUrl;
    }

    async function finishAll() {
        // Registrazione nuovo utente
        await sb.from('users').insert([{ username: state.username, pin: state.tempPin, avatar_url: state.avatarUrl }]);
        finalizeSession();
    }

    function finalizeSession() {
        // Salva localmente per lista account e sessione
        let accounts = JSON.parse(localStorage.getItem('app_accounts') || '[]');
        accounts = accounts.filter(a => a.username !== state.username);
        accounts.unshift({ username: state.username, avatar: state.avatarUrl, lastPinTime: Date.now() });
        localStorage.setItem('app_accounts', JSON.stringify(accounts.slice(0, 5)));
        
        localStorage.setItem('userSession', JSON.stringify({ username: state.username, avatar: state.avatarUrl }));
        window.location.href = 'index.html';
    }

    // --- UTILS ---
    function resetPin() { pinInputs.forEach(i => i.value = ''); pinInputs[0].focus(); }

    function removeAcc(user) {
        let accounts = JSON.parse(localStorage.getItem('app_accounts') || '[]');
        accounts = accounts.filter(a => a.username !== user);
        localStorage.setItem('app_accounts', JSON.stringify(accounts));
        initApp();
    }

    function initApp() {
        const saved = JSON.parse(localStorage.getItem('app_accounts') || '[]');
        if(saved.length > 0) {
            const list = document.getElementById('account-list');
            list.innerHTML = '';
            saved.forEach(acc => {
                const div = document.createElement('div');
                div.className = 'acc-row';
                div.innerHTML = `<img src="${acc.avatar}" class="acc-img"><div class="acc-name">${acc.username}</div>`;
                div.onclick = () => {
                    state.username = acc.username; state.avatarUrl = acc.avatar; state.isLogin = true;
                    // Logica 2 giorni bypass PIN
                    if(Date.now() - acc.lastPinTime < 172800000) finalizeSession();
                    else showStep('pin');
                };
                list.appendChild(div);
            });
            document.getElementById('btn-back-accounts').classList.remove('hidden');
            showStep('accounts');
        } else {
            showStep('user');
        }
    }

    pinInputs.forEach((inp, i) => {
        inp.addEventListener('input', (e) => { if(e.target.value && i < 3) pinInputs[i+1].focus(); });
        inp.addEventListener('keydown', (e) => { if(e.key === 'Backspace' && !e.target.value && i > 0) pinInputs[i-1].focus(); });
    });

    initApp();
</script>
</body>
</html>
